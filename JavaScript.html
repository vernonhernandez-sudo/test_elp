<script>
var SESSION_ID = null;
var currentUser = null;
var showingAllActivity = false;
var confirmCallback = null;
var isSubmitting = false;
var currentTimeZone = 'America/Los_Angeles';
var activeStatusFilter = null;

(function() {
  var stored = sessionStorage.getItem('crm_session');
  if (!stored) return;
  SESSION_ID = stored;
  google.script.run .withSuccessHandler(function(u) {
      if (u && u.name) {
        currentUser = u;
        populateUser();
        routeUserByRole();
      } else { handleSessionExpired(); } })
    .withFailureHandler(function() { handleSessionExpired(); })
    .getUserFromCache(SESSION_ID); })();

function showAgent() {
  document.getElementById('loginScreen').style.display = 'none';
  var m = document.getElementById('agentScreen'); 
  m.style.display = 'flex'; 
  m.style.flexDirection = 'column'; 
  m.style.height = '100vh'; 
  m.style.width = '100vw'; 
  m.style.background = 'linear-gradient(180deg, #800000 0%, #6b1010 8%, #999999 40%, #b0b0b0 70%, #e2e6ed 100%)';
  updateClock(); 
  setInterval(updateClock, 1000);
  startSessionMonitoring();
  loadEntries();
}

function showLeadGen() {
  document.getElementById('loginScreen').style.display = 'none';
  var m = document.getElementById('leadgenScreen');
  if (!m) { console.error('leadgenScreen not found.'); return; }
  m.style.display = 'flex';
  m.style.flexDirection = 'column';
  m.style.height = '100vh';
  m.style.width = '100vw';
  m.style.background = 'linear-gradient(180deg, #800000 0%, #6b1010 8%, #999999 40%, #b0b0b0 70%, #e2e6ed 100%)';
  updateClock();
  setInterval(updateClock, 1000);
  startSessionMonitoring();
  loadEntries();
}

function routeUserByRole() {
  if (!currentUser || !currentUser.role) { console.error('No user role available.'); return; }
  var role = String(currentUser.role).trim();
  var loginScreen = document.getElementById('loginScreen');
  var agentScreen = document.getElementById('agentScreen');
  var leadgenScreen = document.getElementById('leadgenScreen');

  // Hide everything first
  if (loginScreen) { loginScreen.style.display = 'none'; }
  if (agentScreen) { agentScreen.style.display = 'none'; }
  if (leadgenScreen) { leadgenScreen.style.display = 'none'; }
  if (role === 'Sales Partner') {
    if (agentScreen) {
      agentScreen.style.display = 'flex';
      agentScreen.style.flexDirection = 'column';
      agentScreen.style.height = '100vh';
      agentScreen.style.width = '100vw'; }
    showAgent();
    return;
  }
  if (role === 'Lead Gen Specialist') {
    if (leadgenScreen) {
      leadgenScreen.style.display = 'flex';
      leadgenScreen.style.flexDirection = 'column';
      leadgenScreen.style.height = '100vh';
      leadgenScreen.style.width = '100vw'; }
    showLeadGen();
    return; }
  if ( role === 'Admin' || role === 'Super Admin' ) {
    console.warn( 'Dashboard not available yet for role:', role );
    if (loginScreen) { loginScreen.style.display = 'flex'; }
    var error = document.getElementById('loginError');
    if (error) { error.textContent = role + ' dashboard is not available yet.';
      error.style.display = 'block'; }
    return; }
  console.error( 'Unknown user role:', role );
  if (loginScreen) { loginScreen.style.display = 'flex'; }
  var error = document.getElementById('loginError');
  if (error) { error.textContent = 'Your account has an invalid or unsupported role.';
    error.style.display = 'block'; }
}

var sessionCheckInterval = null;

function startSessionMonitoring() {
  if (sessionCheckInterval) { clearInterval(sessionCheckInterval); }
  sessionCheckInterval = setInterval(function() {
    if (!SESSION_ID) return;
    google.script.run .withSuccessHandler(function(result) {
        if (!result || !result.success) { handleSessionExpired(); } })
      .withFailureHandler(function() { })
      .validateSession(SESSION_ID); }, 60000);
}

function stopSessionMonitoring() {
  if (sessionCheckInterval) { clearInterval(sessionCheckInterval); sessionCheckInterval = null; }
}

function handleSessionExpired() {
  stopSessionMonitoring();
  SESSION_ID = null;
  currentUser = null;
  sessionStorage.removeItem('crm_session');
  document.getElementById('agentScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  var error = document.getElementById('loginError');
  if (error) {
    error.textContent = 'Your session has expired. Please log in again during your next available shift.';
    error.style.display = 'block'; }
  var username = document.getElementById('username');
  var password = document.getElementById('password');
  if (username) username.value = '';
  if (password) password.value = '';
}

// ========== APPS SCRIPT ERROR HANDLER ==========
function handleServerError(error, context) {
  console.error( 'Apps Script error [' + (context || 'Unknown') + ']:', error );
  var message = 'Something went wrong. Please try again.';
  if (error && error.message) { message = error.message; } showToast(message, 'error');
}

function updateClock() { 
  var d = new Date(), el = document.getElementById('currentDate'); 
  if (el) el.textContent = d.toLocaleString('en-US', { timeZone: currentTimeZone, weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); 
}

function populateUser() {
  if (!currentUser) return;
  var p = currentUser.name.split(' ').filter(Boolean), ini = p.length > 1 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : (p[0]||'').substring(0,2).toUpperCase();
  document.getElementById('avatar').textContent = ini; 
  document.getElementById('userName').textContent = currentUser.name; 
  document.getElementById('userEmail').textContent = currentUser.email || '';
}

function handleLogin(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var button = document.getElementById('loginButton');
  var error = document.getElementById('loginError'); error.style.display = 'none';
  var emailPattern = /^[A-Z0-9._%+-]+@explorabooks\.com$/i;
  if (!email) { error.textContent = 'Please enter your email address.'; error.style.display = 'block'; return; }
  if (!emailPattern.test(email)) { error.textContent = 'Please use your @explorabooks.com email address.'; error.style.display = 'block'; return; }
  if (!password) { error.textContent = 'Please enter your password.'; error.style.display = 'block'; return; }
  button.disabled = true;
  button.textContent = 'Signing in...';
  google.script.run .withSuccessHandler(function(result) { button.disabled = false; button.textContent = 'Sign In';
      if (result.success) {
        SESSION_ID = result.sessionId;
        currentUser = result.user;
        sessionStorage.setItem( 'crm_session',
          SESSION_ID ); populateUser(); routeUserByRole();
      } else {
        error.textContent = result.message;
        error.style.display = 'block'; } })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = 'Sign In';
      error.textContent = 'Unable to connect to the server. Please try again.';
      error.style.display = 'block'; })
    .loginUser( email, password );
}

function handleLogout() {
  if (SESSION_ID) { google.script.run.logoutUser(SESSION_ID); }
  stopSessionMonitoring();
  sessionStorage.removeItem('crm_session');
  SESSION_ID = null;
  currentUser = null;
  document.getElementById('agentScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginError').style.display = 'none';
}

function showToast(message, type) { 
  var toast = document.getElementById('toast'); 
  toast.textContent = message; 
  toast.className = 'toast ' + (type || 'success'); 
  toast.style.display = 'block'; 
  clearTimeout(toast._timeout); 
  toast._timeout = setTimeout(function() { toast.style.display = 'none'; }, 5000); 
}

function showConfirm(title, message, onConfirm, confirmColor) { 
  document.getElementById('confirmTitle').textContent = title || 'Confirm'; 
  document.getElementById('confirmMessage').innerHTML = message || 'Are you sure?'; 
  document.getElementById('confirmBtn').style.background = confirmColor || '#d32f2f'; 
  document.getElementById('confirmOverlay').style.display = 'flex'; 
  confirmCallback = onConfirm; 
}

function closeConfirm(confirmed) { 
  document.getElementById('confirmOverlay').style.display = 'none'; 
  if (confirmed && typeof confirmCallback === 'function') { 
    var cb = confirmCallback; confirmCallback = null; 
    cb(); } 
}

// ========== ENTRY MODAL ==========
function openEntryModal() {
  var draft = getEntryDraft();
  if (draft) {
    document.getElementById('entryAuthorName').value = draft.authorName || '';
    document.getElementById('entryEmail').value = draft.email || '';
    document.getElementById('entryBook').value = draft.book || '';
    document.getElementById('entryISBN').value = draft.isbn || '';
    document.getElementById('entryAddress').value = draft.address || '';
    var container = document.getElementById('phoneNumbersContainer');
    container.innerHTML = '';
    var phones = Array.isArray(draft.phones) ? draft.phones : [];
    if (phones.length === 0) { phones.push(''); }
    phones.forEach(function(phone) {
      var d = document.createElement('div');
      d.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
      d.innerHTML = '<input type="text" class="entryPhone" ' + 'placeholder="+1 234 567 8900" ' + 'style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;" ' + 'oninput="handleUSPhoneInput(this)">' +
        '<button type="button" onclick="removePhoneField(this)" ' + 'style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;">' + 'Remove</button>';
      container.appendChild(d);
      d.querySelector('.entryPhone').value = formatUSPhoneNumber(phone || ''); });
    updateRemoveButtons();
  } else {
    document.getElementById('entryAuthorName').value = '';
    document.getElementById('entryEmail').value = '';
    document.getElementById('entryBook').value = '';
    document.getElementById('entryISBN').value = '';
    document.getElementById('entryAddress').value = '';
    document.getElementById('phoneNumbersContainer').innerHTML = '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
      '<input type="text" class="entryPhone" ' + 'placeholder="+1 234 567 8900" ' + 'style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;" ' + 'oninput="handleUSPhoneInput(this)">' +
      '<button type="button" onclick="removePhoneField(this)" ' + 'style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;display:none;">' + 'Remove</button>' + '</div>'; }
  document.getElementById('entryError').style.display = 'none';
  updateEntrySubmitButton();
  document.getElementById('addEntryModal').style.display = 'flex';
  document.getElementById('entryAuthorName').focus();
}

// ========== ENTRY DRAFT ==========
var ENTRY_DRAFT_KEY = 'explora_entry_draft';

function saveEntryDraft() {
  var phones = [];
  document.querySelectorAll('.entryPhone').forEach(function(input) {
    var phone = input.value.trim();
    if (phone) { phones.push(phone); } });
  var draft = {
    authorName: document.getElementById('entryAuthorName').value,
    phones: phones,
    email: document.getElementById('entryEmail').value,
    book: document.getElementById('entryBook').value,
    isbn: document.getElementById('entryISBN').value,
    address: document.getElementById('entryAddress').value };
  sessionStorage.setItem(ENTRY_DRAFT_KEY, JSON.stringify(draft));
}

function getEntryDraft() {
  var raw = sessionStorage.getItem( ENTRY_DRAFT_KEY );
  if (!raw) return null; try {
    return JSON.parse(raw);
  } catch (e) {
    sessionStorage.removeItem( ENTRY_DRAFT_KEY );
    return null; }
}

function clearEntryDraft() {
  sessionStorage.removeItem( ENTRY_DRAFT_KEY );
}

function restoreEntryDraft() {
  var draft = getEntryDraft();
  if (!draft) return false;
  document.getElementById('entryAuthorName').value = draft.authorName || '';
  document.getElementById('entryEmail').value = draft.email || '';
  document.getElementById('entryBook').value = draft.book || '';
  document.getElementById('entryISBN').value = draft.isbn || '';
  document.getElementById('entryAddress').value = draft.address || '';
  var container = document.getElementById('phoneNumbersContainer');
  container.innerHTML = '';
  var phones = Array.isArray(draft.phones) ? draft.phones : [];
  if (phones.length === 0) { phones.push(''); }
  phones.forEach(function(phone) {
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
    d.innerHTML = '<input type="text" class="entryPhone" ' + 'placeholder="+1 234 567 8900" ' + 'style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;">' +
      '<button type="button" onclick="removePhoneField(this)" ' + 'style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;">' + 'Remove</button>';
    container.appendChild(d);
    d.querySelector('.entryPhone').value = phone || ''; });
  updateRemoveButtons();
  updateEntrySubmitButton();
  return true;
}

function closeEntryModal() {
  saveEntryDraft();
  document.getElementById('addEntryModal').style.display = 'none';
}

// ==========PHONE FORMATTER ==========
function formatUSPhoneNumber(value) {
  var digits = value.replace(/\D/g, '');
  if ( digits.length === 11 && digits.charAt(0) === '1' ) {
    digits = digits.substring(1); } 
  digits = digits.substring(0, 10);
  if (digits.length <= 3) { return digits;
  } else if (digits.length <= 6) {
    return '(' + digits.substring(0, 3) + ') ' + digits.substring(3);
  } else {
    return '(' + digits.substring(0, 3) + ') ' + digits.substring(3, 6) + '-' + digits.substring(6); }
}

function handleUSPhoneInput(input) {
  var cursorPosition = input.selectionStart;
  var oldValue = input.value;
  var formatted = formatUSPhoneNumber(oldValue);
  input.value = formatted;
  saveEntryDraft();
  input.setSelectionRange( formatted.length, formatted.length );
}

function addPhoneField() {
  var c = document.getElementById('phoneNumbersContainer');
  var d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
  d.innerHTML = '<input type="text" class="entryPhone" ' + 'placeholder="+1 234 567 8900" ' + 'style="flex:1;padding:11px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;">' +
    '<button type="button" ' + 'onclick="removePhoneField(this)" ' + 'style="background:#fee;color:#d32f2f;border:1px solid #fcc;border-radius:6px;cursor:pointer;font-size:12px;padding:0 10px;">' + 'Remove</button>';
  c.appendChild(d);
  updateRemoveButtons();
  saveEntryDraft();
}

function removePhoneField(b) { 
  var c = document.getElementById('phoneNumbersContainer'); 
  if (c.children.length > 1) { b.parentElement.remove(); updateRemoveButtons(); } 
}

function updateRemoveButtons() { 
  var rb = document.getElementById('phoneNumbersContainer').querySelectorAll('button'); 
  if (rb.length <= 1) rb.forEach(function(b) { b.style.display = 'none'; }); 
  else rb.forEach(function(b) { b.style.display = 'inline-block'; }); 
}

function updateEntrySubmitButton() { 
  var an = document.getElementById('entryAuthorName').value.trim(), 
      bk = document.getElementById('entryBook').value.trim(), 
      is = document.getElementById('entryISBN').value.trim(); 
  var b = document.getElementById('entrySubmitBtn'); 
  b.disabled = !(an && bk && is); 
  b.style.opacity = b.disabled ? '0.5' : '1'; 
}

function submitEntry(e) { 
  e.preventDefault(); 
  if (isSubmitting) return; 
  isSubmitting = true; 
  var an = document.getElementById('entryAuthorName').value.trim(), 
      bk = document.getElementById('entryBook').value.trim(), 
      is = document.getElementById('entryISBN').value.trim(), 
      em = document.getElementById('entryEmail').value.trim(), 
      ad = document.getElementById('entryAddress').value.trim(); 
  var pi = document.querySelectorAll('.entryPhone'), ph = []; 
  pi.forEach(function(i) { var v = i.value.trim(); if (v) ph.push(v); }); 
  var er = document.getElementById('entryError'); 
  er.style.display = 'none'; 
  if (!an || !bk || !is) { er.textContent = 'Author Name, Book, and ISBN are required.'; er.style.display = 'block'; isSubmitting = false; return; } 
  google.script.run .withSuccessHandler(function(r) { isSubmitting = false;
    if (r && r.success) { clearEntryDraft();
  showToast( 'Entry saved!', 'success' );
  document.getElementById('addEntryModal').style.display = 'none';
  loadEntries();
    } else {
      er.textContent = (r && r.message) || 'Unable to save entry.';
      er.style.display = 'block'; } })
  .withFailureHandler(function(error) { isSubmitting = false;
    er.textContent = 'Unable to save entry. Please try again.';
    er.style.display = 'block';
    handleServerError(error, 'addEntry'); })
  .addEntry(SESSION_ID, { authorName: an, phones: ph.join(', '), email: em, book: bk, isbn: is, address: ad }); 
}

// ========== TABLE ==========
var allEntries = []; 
var columnFilters = {};

// Load Entries
function loadEntries(callback) { if (!SESSION_ID) return;
  document.getElementById('entriesTableBody').innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">Loading...</td></tr>';
  google.script.run .withSuccessHandler(function(r) {
      if (r && r.success) {
        allEntries = r.entries;
        buildFilterOptions();
        filterTable();
        updateSummaryCards(r.summary); 
        if (typeof callback === 'function') { callback(); }
      } else {
        showToast( (r && r.message) || 'Unable to load entries.', 'error' ); } })
    .withFailureHandler(function(error) { console.error('loadEntries failed:', error);
      showToast( 'Unable to load entries. Please try again.', 'error' ); })
    .getEntries(SESSION_ID);
}

function renderTable(entries) { 
  var tb = document.getElementById('entriesTableBody'); 
  document.getElementById('entryCount').textContent = entries.length + ' Entr' + (entries.length !== 1 ? 'ies' : 'y'); 
  if (!entries.length) { tb.innerHTML = '<tr><td colspan="5" style="padding:60px;text-align:center;color:#aaa;">No entries found.</td></tr>'; return; } 
  var h = ''; 
  entries.forEach(function(e) { 
    var sc, sb;

if (!e.status || e.status === '') {
  sc = '#999';
  sb = '#f5f5f5';

} else if (e.status === 'Pipe') {
  sc = '#e67e22';
  sb = '#fff3e0';

} else if (e.status === 'VM') {
  sc = '#3498db';
  sb = '#ebf5fb';

} else if (e.status === 'DNC') {
  sc = '#e74c3c';
  sb = '#fdedeb';

} else if (e.status === 'Exclusive') {
  sc = '#2c3e50';
  sb = '#ecf0f1';

} else if (e.status === 'Sold') {
  sc = '#2e7d32';
  sb = '#e8f5e9';

} else if (e.status === 'Pending') {
  sc = '#f39c12';
  sb = '#fef5e7';

} else {
  sc = '#999';
  sb = '#f5f5f5';
}
    h += '<tr onclick="selectEntry('+e.id+')" style="cursor:pointer;border-bottom:1px solid #f0f0f0;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'">' +
      '<td style="padding:9px 12px;font-weight:500;text-align:center;">'+escapeHtml(e.authorName)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.book)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">'+escapeHtml(e.isbn)+'</td>' +
      '<td style="padding:9px 12px;color:#555;text-align:center;">' + escapeHtml(e.assignedAgentName) + '</td>' +
      '<td style="padding:9px 12px;text-align:center;"><span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;color:'+sc+';background:'+sb+';">'+(getStatusLabel(e.status))+'</span></td></tr>'; 
  }); 
  tb.innerHTML = h; 
}

function getFilteredEntries() { 
  var f = allEntries.slice(); 
  var st = document.getElementById('searchInput').value.trim().toLowerCase(); 
  if (st) f = f.filter(function(e) { return (e.authorName&&e.authorName.toLowerCase().indexOf(st)>-1)||(e.book&&e.book.toLowerCase().indexOf(st)>-1)||(e.isbn&&e.isbn.toLowerCase().indexOf(st)>-1)||(e.assignedAgentName&&e.assignedAgentName.toLowerCase().indexOf(st)>-1)||(e.status&&e.status.toLowerCase().indexOf(st)>-1); }); 
  for (var field in columnFilters) { if (columnFilters[field] && columnFilters[field].length > 0) f = f.filter(function(e) { var v = ''; switch(field) { case 'author': v=e.authorName; break; case 'book': v=e.book; break; case 'agent': v=e.assignedAgentName; break; case 'status': v=e.status; break; } return columnFilters[field].indexOf(v) > -1; }); } 
  if (activeStatusFilter) f = f.filter(function(e) { return e.status === activeStatusFilter; }); 
  return f; 
}

function filterTable() { renderTable(getFilteredEntries()); }

function buildFilterOptions() { 
  ['author','book','status'].forEach(function(field) { 
    var lc = document.querySelector('#filterDropdown-'+field+' .filter-options-list'); 
    if (!lc) return; 
    var vals = {}; 
    allEntries.forEach(function(e) { var v = ''; switch(field){case'author':v=e.authorName;break;case'book':v=e.book;break;case'status':v=e.status;break;} if(v)vals[v]=(vals[v]||0)+1; }); 
    var sv = Object.keys(vals).sort(); 
    var h = ''; 
    sv.forEach(function(val) { var is = columnFilters[field] && columnFilters[field].indexOf(val) > -1; h += '<div onclick="return toggleColumnFilter(\''+field+'\', \''+escapeHtml(val).replace(/'/g,"\\'")+'\', event)" style="padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;" onmouseover="this.style.background=\'#f8f9fb\'" onmouseout="this.style.background=\'transparent\'"><input type="checkbox" '+(is?'checked':'')+' style="pointer-events:none;"><span>'+escapeHtml(val)+'</span><span style="color:#aaa;font-size:11px;">'+vals[val]+'</span></div>'; }); 
    lc.innerHTML = h; 
  }); 
}

function toggleFilterDropdown(event, field) { 
  event.preventDefault(); event.stopPropagation(); 
  var dd = document.getElementById('filterDropdown-'+field); 
  document.querySelectorAll('.dropdown-content').forEach(function(d){d.style.display='none';}); 
  dd.style.display = dd.style.display === 'block' ? 'none' : 'block'; 
  if (dd.style.display === 'block') buildFilterOptions(); 
  return false; 
}

function filterDropdownOptions(input, field) { 
  var st = input.value.toLowerCase(); 
  document.querySelectorAll('#filterDropdown-'+field+' .filter-options-list div').forEach(function(o) { o.style.display = o.textContent.toLowerCase().indexOf(st) > -1 ? 'flex' : 'none'; }); 
}

function toggleColumnFilter(field, value, event) { 
  if (event) { event.preventDefault(); event.stopPropagation(); } 
  if (!columnFilters[field]) columnFilters[field] = []; 
  var i = columnFilters[field].indexOf(value); 
  if (i > -1) columnFilters[field].splice(i, 1); 
  else columnFilters[field].push(value); 
  filterTable(); 
  return false; 
}

document.addEventListener('click', function(event) { 
  if (!event.target.closest('.dropdown-content') && !event.target.closest('.filter-btn')) { 
    document.querySelectorAll('.dropdown-content').forEach(function(d){d.style.display='none';}); 
  } 
});

function updateSummaryCards(s) { 
  document.getElementById('totalCount').textContent = s.totalAssigned || 0; 
  document.getElementById('pipeCount').textContent = s.pipeCount || 0;
  document.getElementById('exclusiveCount').textContent = s.exclusiveCount || 0;
  document.getElementById('vmCount').textContent = s.vmCount || 0;
  document.getElementById('dncCount').textContent = s.dncCount || 0;
  document.getElementById('soldCount').textContent = s.soldCount || 0; 
}

function filterByStatus(status) { 
  activeStatusFilter = activeStatusFilter === status ? null : status; 
  filterTable(); 
}

function filterByTotal() {
  activeStatusFilter = null;
  filterTable();
}

// ========== DETAIL PANEL ==========
var selectedEntryId = null; 
var selectedEntryData = null; 
var isEditMode = false;

function selectEntry(entryId) {
  var numEntryId = Number(entryId);
  selectedEntryData = null; 
  for (var i = 0; i < allEntries.length; i++) { if (allEntries[i].id == numEntryId) { selectedEntryData = allEntries[i]; break; } }
  if (!selectedEntryData) return; 
  selectedEntryId = numEntryId; 
  isEditMode = false;
  document.getElementById('detailEmpty').style.display = 'none'; 
  document.getElementById('detailContent').style.display = 'flex'; 
  setViewMode();
  document.getElementById('detailAuthorNameView').textContent = selectedEntryData.authorName || '-'; 
  document.getElementById('detailPhonesView').textContent = selectedEntryData.phones || '-';

function setViewMode() {

  ['detailAuthorNameEdit','detailPhonesEdit','detailEmailEdit','detailBookEdit','detailISBNEdit','detailAddressEdit'].forEach(function(id){document.getElementById(id).style.display='none';});

}

    selectedEntryData.transferPending === true

    showToast(

    );

      'Sold leads cannot be edited.',

    );

    'detailBookEdit',
    'detailISBNEdit',
    'detailAddressEdit'
  ].forEach(function(id) {

}

function cancelEdit() { setViewMode(); }

function getStatusLabel(status) {
  switch (status) {
    case 'Pipe': return 'Pipe';
    case 'Exclusive': return 'Exclusive';
    case 'VM': return 'VM - Voicemail';
    case 'DNC': return 'DNC - Do Not Call';
    case 'Sold': return 'Sold';
    case 'Pending': return 'Pending';
    case '':
    case null:
    case undefined: return 'None';
    default: return status; } }

function updateStatusBadge(status) {

  var b = document.getElementById('detailStatus');

  if (!b) return;

  if (!status || status === '') {

    b.style.background = '#f5f5f5';
    b.style.color = '#999';

  } else if (status === 'Pipe') {

    b.style.background = '#fff3e0';
    b.style.color = '#e67e22';

  } else if (status === 'VM') {

    b.style.background = '#ebf5fb';
    b.style.color = '#3498db';

  } else if (status === 'DNC') {

    b.style.background = '#fdedeb';
    b.style.color = '#e74c3c';

  } else if (status === 'Exclusive') {

    b.style.background = '#ecf0f1';
    b.style.color = '#2c3e50';

  } else if (status === 'Sold') {

    b.style.background = '#e8f5e9';
    b.style.color = '#2e7d32';

  } else if (status === 'Pending') {

    b.style.background = '#fef5e7';
    b.style.color = '#f39c12';

  } else {

    b.style.background = '#f5f5f5';
    b.style.color = '#999';
  }

  b.textContent = getStatusLabel(status);
}

// ========== STATUS DROPDOWN PERMISSIONS ==========
function updateStatusDropdownPermissions(entry) {
  var select = document.getElementById('detailStatusSelect');
  if (!select || !entry) return;
  select.disabled = false;
  for (var i = 0; i < select.options.length; i++) { select.options[i].disabled = false; }
  if (entry.transferPending === true) { select.disabled = true; return; }
  if (!currentUser) return;
  if ( String(entry.status || '').trim() === 'Sold' ) { select.disabled = true; return; }
  var minedById = entry.minedById ? String(entry.minedById).trim() : '';
  var currentUserId = currentUser.id ? String(currentUser.id).trim() : '';
  var isOwnLead = minedById !== '' && currentUserId !== '' && minedById === currentUserId;
  var currentStatus = entry.status ? String(entry.status).trim() : '';
  var noStatusOption = select.querySelector( 'option[value=""]' );
  var exclusiveOption = select.querySelector( 'option[value="Exclusive"]' );
  if (currentUser.role === 'Super Admin' || currentUser.role === 'Super Admin' ) { return; }
  if (currentUser.role === 'Admin') { if (isOwnLead) { if (noStatusOption) { noStatusOption.disabled = true; } } return; }
  if (currentUser.role === 'Sales Partner') {
    if (isOwnLead) { if (noStatusOption) { noStatusOption.disabled = true; } return; }
    if (noStatusOption) { if (currentStatus !== '') { noStatusOption.disabled = true; } }
    if (exclusiveOption) { exclusiveOption.disabled = true; } return; } return; 
  }

// ========== TRANSFER PENDING PERMISSIONS ==========

function updateTransferPendingPermissions(entry) {

  if (!entry) return;

  var transferBtn = document.getElementById('transferBtn');
  var editBtn = document.getElementById('editBtn');
  var saveEditBtn = document.getElementById('saveEditBtn');
  var cancelEditBtn = document.getElementById('cancelEditBtn');
  var statusSelect = document.getElementById('detailStatusSelect');

  var isPending = entry.transferPending === true;

  // ==========================================
  // PENDING TRANSFER
  // ==========================================

  if (isPending) {

    // Transfer button
    if (transferBtn) {
      transferBtn.disabled = true;
      transferBtn.style.opacity = '0.5';
      transferBtn.style.cursor = 'not-allowed';
    }

    // Edit button
    if (editBtn) {
      editBtn.disabled = true;
      editBtn.style.opacity = '0.5';
      editBtn.style.cursor = 'not-allowed';
    }

    // Status dropdown
    if (statusSelect) {
      statusSelect.disabled = true;
    }

    // If somehow already in edit mode, force view mode
    if (
      typeof isEditMode !== 'undefined' &&
      isEditMode === true
    ) {
      if (typeof setViewMode === 'function') {
        setViewMode();
      }
    }

    return;
  }

  // ==========================================
  // NOT PENDING
  // ==========================================

  if (transferBtn) {
    transferBtn.disabled = false;
    transferBtn.style.opacity = '1';
    transferBtn.style.cursor = 'pointer';
  }

  if (editBtn) {
    editBtn.disabled = false;
    editBtn.style.opacity = '1';
    editBtn.style.cursor = 'pointer';
  }

  // Re-apply normal status permissions
  updateStatusDropdownPermissions(entry);
}

// ========== REMARKS & ACTIVITY ==========
function toggleActivityView() { 
  if (showingAllActivity) { showingAllActivity = false; document.getElementById('toggleActivityBtn').textContent = 'Show All Activity'; loadRemarksOnly(); } 
  else { showingAllActivity = true; document.getElementById('toggleActivityBtn').textContent = 'Show Remarks Only'; loadEntryActivity(); } 
}

function loadRemarksOnly() {
  if (!selectedEntryId) return;
  if (!SESSION_ID) { return; }
  google.script.run .withSuccessHandler(function(remarks) {
      var c = document.getElementById('remarksList');
      if (!remarks || remarks.length === 0) { c.innerHTML = '<div style="color:#b8a88a;font-size:12px;text-align:center;padding:20px;">No remarks yet.</div>';
        return; }
      var h = ''; remarks.forEach(function(r) {
        var t = new Date(r.timestamp);
        h += '<div style="background:white;border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid #e8dcc8;">' +
            '<div style="display:flex;justify-content:space-between;">' +
              '<span style="font-size:11px;font-weight:600;color:#5d4e37;">' + escapeHtml(r.userName) + '</span>' +
              '<span style="font-size:9px;color:#b8a88a;">' + t.toLocaleString() + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:#3d3223;">' + escapeHtml(r.remark) + '</div>' +
          '</div>'; });
      c.innerHTML = h; })
    .withFailureHandler(function(error) { handleServerError(error, 'getRemarks'); })
    .getRemarks( SESSION_ID, selectedEntryId );
}

function loadEntryActivity() {
  if (!selectedEntryId) return;
  if (!SESSION_ID) { return; }
  google.script.run .withSuccessHandler(function(items) {
      var c = document.getElementById('remarksList');
      if (!items || items.length === 0) { c.innerHTML = '<div style="color:#b8a88a;font-size:12px;text-align:center;padding:20px;">No activity yet.</div>';
        return; }
      var h = ''; items.forEach(function(item) {
        var t = new Date(item.timestamp);
        var bg = item.type === 'activity' ? '#f0f4f8' : 'white';
        var border = item.type === 'activity' ? '#c8d6e5' : '#e8dcc8';
        h += '<div style="background:' + bg + ';border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid ' + border + ';">' +
            '<div style="display:flex;justify-content:space-between;">' +
              '<span style="font-size:11px;font-weight:600;color:#5d4e37;">' + escapeHtml(item.userName) + '</span>' +
              '<span style="font-size:9px;color:#b8a88a;">' + t.toLocaleString() + '</span>' +
            '</div>' +
            '<div style="font-size:12px;color:#3d3223;">' + escapeHtml(item.content) + '</div>' +
          '</div>'; }); c.innerHTML = h; })
    .withFailureHandler(function(error) { handleServerError( error, 'getEntryActivity' ); })
    .getEntryActivity( SESSION_ID, selectedEntryId );
}

function addRemark() {
  var txt = document.getElementById('remarkInput').value.trim();
  if (!txt) return;
  google.script.run .withSuccessHandler(function(r) {
      if (r && r.success) { document.getElementById('remarkInput').value = '';
        if (showingAllActivity) { loadEntryActivity(); } else { loadRemarksOnly(); }
      } else {
        showToast( (r && r.message) || 'Unable to add remark.', 'error' ); } })
    .withFailureHandler(function(error) { handleServerError(error, 'addRemark'); })
    .addRemark( SESSION_ID, selectedEntryId, txt );
}

function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ========== EVENT LISTENERS ==========
document.addEventListener('keydown', function(e) { 
  if (e.key === 'Enter' && document.activeElement === document.getElementById('remarkInput')) { e.preventDefault(); addRemark(); } 
  if (e.key === 'Escape') { closeEntryModal(); closeConfirm(false); } 
});

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('confirmBtn').addEventListener('click', function() { closeConfirm(true); });
  document.getElementById('confirmOverlay').addEventListener('click', function(e) { if (e.target === document.getElementById('confirmOverlay')) closeConfirm(false); });
  ['entryAuthorName','entryBook','entryISBN'].forEach(function(id) { 
    var el = document.getElementById(id); if (el) el.addEventListener('input', updateEntrySubmitButton); });
});

// ========== TRANSFER MODAL ==========
function openTransferModal() {
  if (!selectedEntryData) { showToast( 'Please select a lead first.', 'error' ); return; }
  if (selectedEntryData.status === 'Sold') { showToast( 'Sold leads cannot be transferred.', 'error' ); return; }
  document.getElementById('transferTarget').value = '';
  document.getElementById('transferReason').value = '';
  document.getElementById('transferError').style.display = 'none';
  document.getElementById('transferLeadInfo').textContent = 'Author - ' + (selectedEntryData.authorName || 'Unnamed Lead');
  document.getElementById('transferLeadModal').style.display = 'flex';
  loadTransferTargets();
}

function closeTransferModal() { document.getElementById('transferLeadModal').style.display = 'none'; }

// Load Transfer Target
function loadTransferTargets() {
  var select = document.getElementById('transferTarget');
  if (!select) return;
  select.innerHTML = '<option value="">Loading...</option>';
  google.script.run .withSuccessHandler(function(r) { console.log('getTransferTargets response:', r);
      select.innerHTML = '<option value="">Select Admin or Sales Partner</option>';
      if (!r || !r.success) { select.innerHTML = '<option value="">ERROR: ' + ((r && r.message) || 'Unknown error') + '</option>'; return; }
      if (!r.targets || r.targets.length === 0) { select.innerHTML = '<option value="">No available users</option>'; return; }
      r.targets.forEach(function(target) {
        var option = document.createElement('option');
        option.value = target.id;
        option.textContent = target.name + ' (' + target.role + ')';
        select.appendChild(option); }); })
    .withFailureHandler(function(error) { console.error( 'getTransferTargets FAILED:', error );
      select.innerHTML = '<option value="">ERROR: ' + (error.message || error.toString()) + '</option>'; }) .getTransferTargets(SESSION_ID); }

   // Submit Transfer Request
function submitTransferRequest() {

  if (!selectedEntryId) {
    showToast('No lead selected.', 'error');
    return;
  }

  var targetSelect = document.getElementById('transferTarget');
  var reasonInput = document.getElementById('transferReason');

  if (!targetSelect) {
    showToast('Transfer target field not found.', 'error');
    return;
  }

  var targetAgentId = targetSelect.value;
  var reason = reasonInput ? reasonInput.value.trim() : '';

  if (!targetAgentId) {
    showToast('Please select a transfer target.', 'error');
    return;
  }

  var submitBtn = document.getElementById('submitTransferBtn');

  if (submitBtn) {
    if (submitBtn.disabled) return;

    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.5';
    submitBtn.textContent = 'Submitting...';
  }

  console.log('TRANSFER DEBUG:', {
    sessionId: SESSION_ID,
    entryId: selectedEntryId,
    targetAgentId: targetAgentId,
    reason: reason
  });

  google.script.run

    .withSuccessHandler(function(response) {

      console.log(
        'CREATE TRANSFER RESPONSE:',
        response
      );

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.textContent = 'Request Transfer';
      }

      if (response && response.success) {

        showToast(
          response.message ||
          'Transfer request submitted for approval.',
          'success'
        );

        var modal =
          document.getElementById('transferLeadModal');

        if (modal) {
          modal.style.display = 'none';
        }

        if (targetSelect) {
          targetSelect.value = '';
        }

        if (reasonInput) {
          reasonInput.value = '';
        }

        loadRemarksOnly();

      } else {

        console.error(
          'TRANSFER SERVER REJECTED:',
          response
        );

        showToast(
          'TRANSFER REJECTED: ' +
          (
            response && response.message
              ? response.message
              : 'No message returned by server.'
          ),
          'error'
        );
      }

    })

    .withFailureHandler(function(error) {

      console.error(
        'CREATE TRANSFER SERVER ERROR:',
        error
      );

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.textContent = 'Request Transfer';
      }

      showToast(
        'SERVER ERROR: ' +
        (
          error && error.message
            ? error.message
            : String(error)
        ),
        'error'
      );

    })

    .createTransferRequest(
      SESSION_ID,
      selectedEntryId,
      targetAgentId,
      reason
    );
}
